<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revue de presse</title>
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revue de presse">
<style>
  :root {
    --fond:#f6f3ee; --carte:#ffffff; --texte:#22252a; --doux:#6b6f76; --accent:#b4232c;
    --accent-doux:#f6e3e3; --ligne:#e7e2da; --ombre:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
    --serif: "Iowan Old Style", "Charter", "Palatino", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fond:#16181c; --carte:#1f2227; --texte:#e9e6e1; --doux:#9da2a9; --accent:#ff7a7f;
            --accent-doux:#3a2326; --ligne:#2d3138; --ombre:none; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--fond); color:var(--texte); font-family:var(--sans); }

  header { max-width:680px; margin:auto; padding:calc(env(safe-area-inset-top) + 24px) 20px 4px; }
  .surtitre { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  header h1 { margin:4px 0 2px; font-family:var(--serif); font-size:2rem; line-height:1.15; }
  header p { margin:0; color:var(--doux); font-size:.9rem; }

  nav { position:sticky; top:0; z-index:2; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
        padding:12px 20px; background:color-mix(in srgb, var(--fond) 88%, transparent);
        -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-bottom:1px solid var(--ligne); }
  nav::-webkit-scrollbar { display:none; }
  nav a { flex:none; text-decoration:none; color:var(--texte); font-size:.85rem; font-weight:500;
          background:var(--carte); border:1px solid var(--ligne); border-radius:999px; padding:6px 14px; }
  nav a:active { background:var(--accent-doux); }

  main { max-width:680px; margin:auto; padding:0 16px calc(env(safe-area-inset-bottom) + 48px); }
  .outils { display:flex; justify-content:flex-end; gap:8px; margin:16px 4px 0; }
  .outils button { font:inherit; font-size:.8rem; font-weight:600; color:var(--accent); background:none;
                   border:none; padding:6px 4px; cursor:pointer; }

  details.section { scroll-margin-top:64px; margin-top:10px; }
  details.section > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
       padding:14px 14px; border-radius:12px; background:var(--carte); border:1px solid var(--ligne);
       -webkit-tap-highlight-color:transparent; }
  details.section > summary::-webkit-details-marker { display:none; }
  details.section[open] > summary { margin-bottom:14px; }
  h2 { flex:1; display:flex; align-items:center; gap:10px; margin:0; font-size:.8rem; font-weight:700;
       letter-spacing:.1em; text-transform:uppercase; color:var(--texte); }
  h2::before { content:""; flex:none; width:4px; height:1.1em; border-radius:2px; background:var(--accent); }
  .compte { font-size:.75rem; font-weight:700; color:var(--accent); background:var(--accent-doux);
            border-radius:999px; padding:2px 9px; }
  .chevron { width:9px; height:9px; margin:0 4px 4px; border-right:2px solid var(--doux);
             border-bottom:2px solid var(--doux); transform:rotate(45deg); transition:transform .2s; }
  details.section[open] .chevron { transform:rotate(-135deg); margin-bottom:-4px; }

  .carte { background:var(--carte); border:1px solid var(--ligne); border-radius:16px; box-shadow:var(--ombre);
           padding:18px 18px 14px; margin-bottom:14px; }
  .meta { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .num { font-size:.75rem; font-weight:700; color:var(--accent); }
  .badge { font-size:.7rem; font-weight:600; color:var(--accent); background:var(--accent-doux);
           border-radius:999px; padding:2px 8px; }
  .carte h3 { margin:0 0 10px; font-family:var(--serif); font-size:1.3rem; line-height:1.3; font-weight:700; }
  .chapeau { margin:0 0 12px; font-size:1.02rem; line-height:1.5; font-weight:500; }
  .points { margin:0 0 6px; padding:0; list-style:none; }
  .points li { position:relative; padding:5px 0 5px 20px; font-size:.95rem; line-height:1.45; color:var(--texte); }
  .points li::before { content:""; position:absolute; left:4px; top:.85em; width:6px; height:6px;
                       border-radius:50%; background:var(--accent); }

  .carte details { margin-top:6px; border-top:1px solid var(--ligne); }
  .carte summary { list-style:none; cursor:pointer; padding:12px 0 4px; font-size:.9rem; font-weight:600; color:var(--accent); }
  .carte summary::-webkit-details-marker { display:none; }
  .carte summary::after { content:" ↓"; }
  .carte details[open] summary::after { content:" ↑"; }
  .carte details[open] summary { color:var(--doux); }
  .texte p { margin:10px 0 0; font-family:var(--serif); font-size:1.08rem; line-height:1.65; }

  .sources { margin:12px 0 0; font-size:.78rem; color:var(--doux); }
  .sources a { color:var(--doux); }
  .vide { color:var(--doux); font-style:italic; margin:0 4px; }
  footer { text-align:center; color:var(--doux); font-size:.75rem; line-height:1.5; margin-top:40px; padding:0 20px; }
</style>
</head>
<body>
<header>
  <div class="surtitre">Québec · Canada</div>
  <h1>Revue de presse</h1>
  <p>{{DATE}} · mise à jour à {{HEURE}}</p>
</header>
<nav>{{NAV}}</nav>
<main>
<div class="outils">
  <button type="button" id="tout-ouvrir">Tout déplier</button>
  <button type="button" id="tout-fermer">Tout replier</button>
</div>
{{SECTIONS}}
<footer>Résumés rédigés automatiquement par une IA à partir de plusieurs médias.<br>Les noms des sources mènent aux articles originaux.</footer>
</main>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

  // Sections repliables : l'état de chaque section est mémorisé sur cet appareil.
  const sections = [...document.querySelectorAll("details.section")];
  const CLE = "sections-ouvertes";
  let ouvertes = null;
  try { ouvertes = JSON.parse(localStorage.getItem(CLE)); } catch (e) {}
  sections.forEach((s) => { s.open = Array.isArray(ouvertes) ? ouvertes.includes(s.id) : true; });
  const memoriser = () => {
    try { localStorage.setItem(CLE, JSON.stringify(sections.filter((s) => s.open).map((s) => s.id))); } catch (e) {}
  };
  sections.forEach((s) => s.addEventListener("toggle", memoriser));
  document.getElementById("tout-ouvrir").onclick = () => sections.forEach((s) => (s.open = true));
  document.getElementById("tout-fermer").onclick = () => sections.forEach((s) => (s.open = false));

  // Un clic dans le menu ouvre la section visée avant d'y défiler
  document.querySelectorAll("nav a").forEach((a) =>
    a.addEventListener("click", () => {
      const cible = document.getElementById(a.getAttribute("href").slice(1));
      if (cible) cible.open = true;
    })
  );
</script>
</body>
</html>
