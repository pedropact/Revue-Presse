# Sections affichées dans l'application, dans cet ordre.
#   categorie : sujet de l'article (voir « categories » plus bas)
#   portee    : canada  -> sujets fédéraux / pancanadiens
#               quebec  -> sujets propres au Québec
#               tous    -> Canada et Québec confondus
#   nb        : nombre de sujets affichés
sections:
  - {id: economie-canada, court: "Éco Canada",  titre: "Économie — Canada",                       categorie: economie,      portee: canada, nb: 3}
  - {id: economie-quebec, court: "Éco Québec",  titre: "Économie — Québec",                       categorie: economie,      portee: quebec, nb: 3}
  - {id: politique-canada, court: "Politique Canada", titre: "Canada — Gouvernement et politique",      categorie: politique,     portee: canada, nb: 3}
  - {id: politique-quebec, court: "Politique Québec", titre: "Québec — Gouvernement et politique",      categorie: politique,     portee: quebec, nb: 3}
  - {id: international, court: "International",    titre: "Relations extérieures",                   categorie: international, portee: tous,   nb: 4}
  - {id: sante, court: "Santé",            titre: "Santé — Canada et Québec",                categorie: sante,         portee: tous,   nb: 3}
  - {id: environnement, court: "Environnement",    titre: "Environnement — Canada et Québec",        categorie: environnement, portee: tous,   nb: 3}
  - {id: immigration, court: "Immigration",      titre: "Immigration — Canada et Québec",          categorie: immigration,   portee: tous,   nb: 3}
  - {id: securite, court: "Sécurité",         titre: "Sécurité — Canada et Québec",             categorie: securite,      portee: tous,   nb: 3}
  - {id: technologie, court: "Techno",  titre: "Technologie — Canada et Québec",          categorie: technologie,   portee: tous,   nb: 3}

# Chaque catégorie est décrite par quelques phrases (FR et EN) : le modèle d'embeddings
# compare chaque article à ces descriptions. Les mots-clés donnent un bonus.
# "ancrage_requis": l'article doit mentionner le Canada ou le Québec.
categories:
  - id: economie
    descriptions:
      - Économie du Québec et du Canada, inflation, taux d'intérêt de la Banque du Canada, emploi et chômage
      - Entreprises, commerce, tarifs douaniers, marché immobilier, budget et finances publiques
      - Canadian economy, inflation, Bank of Canada interest rates, jobs report, trade and tariffs
    mots_cles: [économie, inflation, "taux directeur", "Banque du Canada", chômage, emploi, PIB, tarifs, budget, récession, economy, tariff, "interest rate", GDP, jobs, housing market]

  - id: politique
    descriptions:
      - Gouvernement du Québec, Assemblée nationale, premier ministre du Québec, partis politiques québécois
      - Gouvernement fédéral à Ottawa, Parlement, Chambre des communes, élections et partis politiques canadiens
      - Canadian federal government, Parliament, House of Commons, prime minister, provincial politics, elections
    mots_cles: [gouvernement, ministre, "Assemblée nationale", Ottawa, Parlement, Communes, élection, CAQ, PQ, libéral, conservateur, NPD, "Bloc québécois", Parliament, election, premier, Liberals, Conservatives]

  - id: international
    descriptions:
      - Relations entre le Canada et les États-Unis, commerce avec les Américains, Maison-Blanche et Ottawa
      - Diplomatie canadienne, accords internationaux, relations du Québec avec la France et l'étranger
      - Canada-US relations, foreign policy, trade negotiations, Canada and NATO, Canada and China, Canada and India
    mots_cles: [diplomatie, "États-Unis", Washington, "Maison-Blanche", ACEUM, OTAN, ambassade, "affaires étrangères", diplomacy, "foreign affairs", CUSMA, NATO, "White House", embassy]
    ancrage_requis: true

  - id: sante
    descriptions:
      - Système de santé du Québec, hôpitaux, urgences, médecins, infirmières, Santé Québec
      - Santé publique, maladies, vaccination, médicaments, santé mentale
      - Canadian health care, hospitals, emergency rooms, doctors, nurses, public health, vaccines
    mots_cles: [santé, hôpital, urgences, médecin, infirmière, "Santé Québec", vaccin, "santé publique", health, hospital, doctor, nurses, "public health", vaccine]

  - id: environnement
    descriptions:
      - Environnement et climat au Québec et au Canada, changements climatiques, émissions de gaz à effet de serre
      - Feux de forêt, inondations, pollution, biodiversité, énergie propre, transition énergétique, pipelines
      - Environment and climate change in Canada, wildfires, floods, emissions, pollution, clean energy, oil and gas pipelines
    mots_cles: [environnement, climat, climatique, GES, émissions, "feux de forêt", inondations, pollution, biodiversité, "énergie propre", pipeline, carbone, environment, climate, wildfire, emissions, pollution, "clean energy", carbon]

  - id: immigration
    descriptions:
      - Immigration au Québec et au Canada, seuils d'immigration, travailleurs étrangers temporaires, étudiants étrangers
      - Demandeurs d'asile, réfugiés, permis de travail, résidence permanente, citoyenneté, francisation
      - Immigration to Canada, asylum seekers, refugees, temporary foreign workers, international students, permanent residency
    mots_cles: [immigration, immigrants, "demandeurs d'asile", réfugiés, "travailleurs étrangers", "étudiants étrangers", "résidence permanente", citoyenneté, IRCC, asylum, refugees, "foreign workers", "permanent resident"]

  - id: securite
    descriptions:
      - Sécurité publique, criminalité, police, SPVM, Sûreté du Québec, GRC, crime organisé
      - Défense nationale, Forces armées canadiennes, sécurité nationale, cybersécurité, terrorisme, frontière
      - Public safety, crime, police, RCMP, national security, Canadian Armed Forces, border security, cybersecurity
    mots_cles: [police, SPVM, "Sûreté du Québec", GRC, crime, meurtre, fusillade, sécurité, défense, armée, frontière, cybersécurité, terrorisme, RCMP, shooting, defence, military, border, "national security"]

  - id: technologie
    descriptions:
      - Technologie au Québec et au Canada, intelligence artificielle, entreprises technologiques, jeunes pousses, Shopify, Mila
      - Numérique, cybersécurité, protection des données, réseaux sociaux, télécommunications, CRTC, Bell, Rogers, Vidéotron
      - Canadian tech industry, artificial intelligence, startups, telecom, data privacy, online regulation, semiconductors
    mots_cles: [technologie, techno, "intelligence artificielle", IA, numérique, "jeune pousse", cybersécurité, "données personnelles", "réseaux sociaux", CRTC, télécommunications, technology, tech, "artificial intelligence", AI, startup, telecom, privacy, Shopify, Mila]
    ancrage_requis: true

# Mots indiquant qu'un article concerne le Canada/Québec (pour ancrage_requis)
ancrage: [Canada, canadien, canadienne, Canadian, Québec, Quebec, québécois, Ottawa, Montréal, Montreal, Toronto, fédéral, federal]

# Pour séparer « Canada » et « Québec » : on compte ces marqueurs dans les articles d'un sujet.
# S'il y a plus de marqueurs québécois que canadiens, le sujet va dans la section Québec.
marqueurs_quebec: [Québec, Quebec, québécois, québécoise, québécoises, Montréal, Montreal, Laval, Gatineau, Sherbrooke, "Trois-Rivières", Saguenay, Longueuil, Lévis, Rimouski, "Assemblée nationale", CAQ, "Coalition avenir Québec", "Parti québécois", "Québec solidaire", "Hydro-Québec", "Santé Québec", SAAQ, "Caisse de dépôt", "Sûreté du Québec", SPVM, provincial, provinciale, "National Assembly"]
marqueurs_canada: [Canada, canadien, canadienne, canadiens, Canadian, Canadians, Ottawa, fédéral, fédérale, federal, Communes, Commons, Parlement, Parliament, Sénat, Senate, "Bloc québécois", GRC, RCMP, Ontario, Alberta, "Colombie-Britannique", "British Columbia", Manitoba, Saskatchewan, Toronto, Vancouver, Calgary, Edmonton, Winnipeg]
