# Configuration de la revue de presse quotidienne (Québec / Canada)
# Modifiez ce fichier pour ajouter des sources ou ajuster les thèmes.

general:
  langue_sortie: fr
  fenetre_heures: 30          # n'utilise que les articles publiés dans les X dernières heures
  seuil_theme: 0.33           # similarité minimale pour classer un article dans un thème
  seuil_regroupement: 0.70    # similarité minimale (titres) pour considérer deux articles comme le même sujet
  max_articles_par_resume: 4  # articles envoyés au modèle pour produire un résumé fusionné
  max_caracteres_article: 2500

modeles:
  # Résumés par Google Gemini (secret GEMINI_API_KEY dans GitHub). Sans clé, ou en cas
  # d'échec, le modèle local ci-dessous est utilisé.
  # Un appel par section (~10 par jour). Si le premier modèle atteint son quota, on passe au suivant.
  gemini_modeles: [gemini-flash-latest, gemini-flash-lite-latest]
  gemini_requetes_par_minute: 4   # le forfait gratuit limite le nombre de requêtes par minute
  embeddings: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  # Modèle de résumé (GGUF, exécuté sur CPU via llama.cpp).
  # Pour une meilleure qualité (mais ~2x plus lent) :
  #   repo: Qwen/Qwen2.5-3B-Instruct-GGUF  /  fichier: qwen2.5-3b-instruct-q4_k_m.gguf
  llm_repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
  llm_fichier: qwen2.5-1.5b-instruct-q4_k_m.gguf
  llm_contexte: 8192

# paywall: true  -> on n'utilise que le titre et le chapeau fournis par le flux RSS
