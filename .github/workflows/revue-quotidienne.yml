name: Revue de presse quotidienne

on:
  schedule:
    # Objectif : revue prête vers 7 h (heure de Montréal). La génération prend ~30 min,
    # donc on démarre à 6 h 05. GitHub ne connaît que l'heure UTC : on planifie à
    # 10 h 05 (heure d'été) et 11 h 05 (heure normale) UTC, et le job « horaire »
    # ne laisse passer que celle qui tombe à 6 h à Montréal.
    - cron: "5 10 * * *"
    - cron: "5 11 * * *"
  workflow_dispatch:
    inputs:
      sans_ia:
        description: "Sans modèle de résumé (test rapide)"
        type: boolean
        default: false

concurrency:
  group: revue
  cancel-in-progress: false

jobs:
  horaire:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.h.outputs.go }}
    steps:
      - id: h
        run: |
          heure=$(TZ=America/Toronto date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$heure" = "06" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Il est ${heure} h à Montréal : exécution ignorée (l'autre horaire s'en charge)."
          fi

  revue:
    needs: horaire
    if: needs.horaire.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: /home/runner/.cache/huggingface
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Cache des modèles d'IA
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/huggingface
            /home/runner/.cache/fastembed
          key: modeles-${{ hashFiles('config.yaml') }}
          restore-keys: modeles-

      - name: Générer la revue de presse
        run: python src/main.py ${{ inputs.sans_ia && '--sans-ia' || '' }}

      - name: Publier sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJET: ${{ vars.CF_PROJET || 'revue-presse' }}
        run: |
          set -o pipefail
          # Crée le projet la première fois (sans effet s'il existe déjà)
          npx --yes wrangler@4 pages project create "$PROJET" --production-branch=main || true
          # En cas d'échec, les dernières lignes sont affichées dans le résumé de l'exécution
          if ! npx --yes wrangler@4 pages deploy public --project-name="$PROJET" --branch=main 2>&1 | tee deploy.log; then
            tail -n 8 deploy.log | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do [ -n "$l" ] && echo "::error::$l"; done
            exit 1
          fi
          grep -o 'https://[^ ]*pages.dev' deploy.log | tail -1 | sed 's/^/::notice::Site publié : /'
